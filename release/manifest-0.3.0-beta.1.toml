# Pins for the 0.3.0-beta.1 binary.
# version is the crates.io crate in Cargo.lock. git is that repo's main
# when the binary was built. The publish job's patch bump is not always
# merged, so Cargo.toml at git can lag version.
project_version = "0.3.0-beta.1"
differential_record_id = "pending"
variants = ["blvm", "blvm-minimal"]

