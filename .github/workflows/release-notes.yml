name: Release notes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notes:
    name: published sections match regeneration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check published release notes
        run: python3 scripts/release/build_release_notes.py --check
