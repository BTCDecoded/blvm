# cargo audit configuration
# Advisories are ignored here only when:
#   (a) no fix is available, OR
#   (b) the fix requires a large dependency upgrade that is tracked separately.
# Each entry must include the reason and a GitHub issue or tracking note.

[advisories]
ignore = [
    # quinn-proto 0.11.15. The patched line is >=0.11.19. That bump is separate
    # from the iroh 1.0 change. Hickory 0.25 left with iroh 0.95; iroh 1.0 pulls 0.26.3.
    "RUSTSEC-2026-0338",
    "RUSTSEC-2026-0339",
    "RUSTSEC-2026-0340",
    "RUSTSEC-2026-0341",
    "RUSTSEC-2026-0342",
    # wasmtime 36.0.18. blvm-sdk 0.1.19 requires wasmtime =36.0.18.
    # Both advisories are fixed in wasmtime >=36.0.19. That pin moves when blvm-sdk is published again.
    # The default release binary does not enable the wasm-modules feature.
    "RUSTSEC-2026-0379",
    "RUSTSEC-2026-0380",
    # wasmtime 36.0.19. Published blvm-sdk 0.1.20 requires wasmtime =36.0.19.
    # RUSTSEC-2026-0424 is fixed in >=36.0.20. That pin moves when blvm-sdk is published again.
    # The default release binary does not enable the wasm-modules feature.
    "RUSTSEC-2026-0424",
]
