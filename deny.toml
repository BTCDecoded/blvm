# cargo-deny policy for the blvm binary.
# Vulnerability IDs match .cargo/audit.toml.
# quinn-proto 0.11.19, rand 0.8.6, and wasmtime 36.0.20 are in Cargo.lock.

[advisories]
# cargo-deny 0.16 removed the vulnerability lint. Vulnerabilities still deny
# unless they are in ignore. 0.18 made unmaintained a scope: none, workspace,
# transitive, or all. "warn" is not a scope. "none" does not fail the build.
unmaintained = "none"
yanked = "warn"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
    "Unlicense",
    "BSL-1.0",
    "MIT-0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-git = []
